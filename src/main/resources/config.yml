# ===================================================================
# ZthEvent2611Oj233Helper 配置
#
# 消息文本均使用 MiniMessage 语法：
#   颜色   <gray> <white> <red> <aqua>
#   装饰   <u> 下划线、<b> 加粗
# 玩家在对话框里勾选「不再提示」并确认后，选择会记录在 player-data.yml 中
# （插件自动维护），之后进服不再自动弹出该对话框，/zth-event open 也会跳过；
# 需要强制显示时使用 /zth-event open force。
# 跨服本身由其他插件负责，本插件只负责提示、重复执行下面配置的命令。
# ===================================================================

# 运行模式
# true（托管模式）：玩家进服后自动切换旁观并弹出提示对话框；确认后自动开始跨服；
#   取消或超时会踢出玩家（客户端可由群组网络带回云端）。
#   适用于活动入口服 / 云端中转服。
# false（通用模式，默认）：进服时不做任何事；用 /zth-event open [玩家] 打开提示对话框；
#   确认后执行跨服命令；取消只关闭对话框；命令尝试完仍在本服时不踢出玩家。
#   适用于其他服务器自行接入本插件。
# 注意：元竞 鱼来 KOIKOI 活动入口服需要设为 true。
managed: false

# 跨服流程设置
flow:
  # （仅托管模式）玩家进入服务器后是否自动开始引导流程。
  # 关闭后可通过 /zth-event start 手动启动。
  start-on-join: true

  # （仅托管模式）开始引导时切换到的游戏模式。
  # 可选：SURVIVAL / CREATIVE / ADVENTURE / SPECTATOR / NONE（不改变模式）。
  gamemode: SPECTATOR

  # 玩家确认提示对话框后，每隔多少秒执行一次下面的命令。
  interval-seconds: 10

  # 最多执行几次命令；总超时 = interval-seconds × attempts（默认 10 × 3 = 30 秒）。
  # 托管模式：超时仍未离开本服时踢出玩家。
  # 通用模式：超时只记录警告，不踢出玩家。
  attempts: 3

  # 每次尝试执行的命令，由控制台执行。
  # 可用占位符：{player} 为玩家名，{uuid} 为玩家 UUID。
  # 跨服由其他插件负责，这里填写触发跨服的命令即可。
  commands:
    - "omt {player} koikoi"

  # （仅托管模式）超时踢出玩家时显示的消息。
  kick-message: '<gray>跨服超时，请重新连接后重试.</gray>'

# 聊天栏与对话框提示
messages:
  # 聊天栏：确认对话框后显示「正在进行跨服......」，其开头与结尾各留的空行数量。
  gap-lines: 1
  transferring: '<gray>正在进行跨服......</gray>'

  # 提示对话框：玩家确认后才会开始跨服流程，提示不会在跨服过程中被清掉。
  dialog:
    # 对话框标题
    title: '<white>元竞 鱼来 KOIKOI</white>'

    # 对话框正文，可写多行；空行会显示为段落间距。
    # 每行不宜过长，对话框会自动换行，手动控制断行观感更好。
    body:
      - '<gray>由 <red>RIA</red> <white>×</white> <aqua>TRIALHAMMER</aqua> 联合开发的限时活动服务器.</gray>'
      - ''
      - '<gray>此服务器与 RIA 群组网络的聊天、存档和经济等系统不互通.</gray>'

    # 「不再提示」复选框：默认不勾选；勾选并确认后不再自动弹出此对话框，
    # 命令打开时也会跳过（/zth-event open force 可强制显示）。
    checkbox:
      # 表单字段名，一般无需修改
      key: dont_show_again
      label: '不再提示'
      initial: false
      # 勾选 / 未勾选时提交的值，一般无需修改
      on-true: 'true'
      on-false: 'false'

    # 按钮
    # 确认：勾选「不再提示」并开始跨服流程。
    confirm:
      label: '确认'
      tooltip: '<gray>点击确认后开始跨服流程.</gray>'

    # 取消：不开始跨服流程。
    # 托管模式下踢出玩家（客户端随所在网络自动回到云端）；通用模式下只关闭对话框。
    cancel:
      label: '取消'
      tooltip: '<gray>取消并返回云端.</gray>'
      # （仅托管模式）踢出玩家时显示的消息
      kick-message: '<gray>已取消，正在返回云端.</gray>'

    # 是否允许按 Esc 关闭对话框；false 时必须点击按钮
    can-close-with-escape: false

